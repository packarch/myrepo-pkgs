# Dark LightDM greeter: Packarch-Greeter (GTK 3 of Greybird-dark, in this
# package), Packarch icons (packarch-icons, blue folders), Qogir-Dark cursor
# (qogir-icon-theme), wallpaper-alt.png background (packarch-backgrounds),
# packarch.png for the users without an image (~/.face, AccountsService).
# /etc/lightdm/lightdm-gtk-greeter.conf is read after this file.
[greeter]
theme-name = Packarch-Greeter
icon-theme-name = Packarch
cursor-theme-name = Qogir-Dark
background = /usr/share/backgrounds/wallpaper-alt.png
default-user-image = /usr/share/pixmaps/packarch.png
