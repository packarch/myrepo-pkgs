# Packarch : waypaper (« Changer de fond d'écran » du menu de labwc), comme
# nitrogen sous Openbox : images de /usr/share/backgrounds, mode et couleur
# au choix. post_command enregistre le choix dans ~/.config/labwc/wallpaper
# (scripts/image), relu à l'ouverture de session (scripts/wallpaper, swaybg) ;
# le fond est mis sur tous les écrans, comme sous Openbox. Un changement de
# thème remet le fond du thème.
[Settings]
language = fr
folder = /usr/share/backgrounds
subfolders = True
all_subfolders = True
backend = swaybg
fill = fill
color = #000000
sort = name
number_of_columns = 3
monitors = All
post_command = ~/.config/labwc/scripts/image --wallpaper $wallpaper $fill $color
